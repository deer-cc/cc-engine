version: '3.8'

services:
  customer-service:
    build: .
    ports:
      - "8899:8899"
    environment:
      - ANTHROPIC_BASE_URL=http://host.docker.internal:15721
      - ANTHROPIC_AUTH_TOKEN=PROXY_MANAGED
      - LLM_MODEL=claude-opus-4-8-20251101
    volumes:
      - ./knowledge:/app/knowledge
      - ./conversations:/app/conversations
    restart: unless-stopped
