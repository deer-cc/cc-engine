from fastapi import FastAPI
from fastapi.staticfiles import StaticFiles
from fastapi.responses import HTMLResponse

app = FastAPI(title="客服引擎演示")

@app.get("/", response_class=HTMLResponse)
async def demo():
    return """
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .chat-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .messages { max-height: 400px; overflow-y: auto; margin-bottom: 16px; }
        .message { margin-bottom: 12px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .message.user .bubble { background: #667eea; color: white; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
        .typing-indicator { display: inline-block; padding: 2px 8px; }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
        .input-area input:focus { border-color: #667eea; }
        .input-area button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; }
        .input-area button:hover { background: #5a6fd6; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .status { text-align: center; color: #999; font-size: 12px; margin-top: 12px; }
        .status.loading { color: #667eea; }
        .status.error { color: #e74c3c; }
        .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .quick-reply { padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 16px; font-size: 12px; cursor: pointer; }
        .quick-reply:hover { background: #e0e0e0; }
        .meta { font-size: 11px; color: #999; margin-top: 4px; }
        .bubble.typing { min-width: 60px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 智能客服演示</h1>
        <p>AI 意图识别 + 多轮对话 + RAG 知识库融合</p>
    </div>
    <div class="chat-container">
        <div class="quick-replies">
            <button class="quick-reply" onclick="sendQuick('你好，在吗？')">打招呼</button>
            <button class="quick-reply" onclick="sendQuick('什么时候发货？')">物流查询</button>
            <button class="quick-reply" onclick="sendQuick('我想退货，怎么办？')">退换货</button>
            <button class="quick-reply" onclick="sendQuick('这个多少钱？')">价格咨询</button>
            <button class="quick-reply" onclick="sendQuick('有货吗？')">库存查询</button>
            <button class="quick-reply" onclick="sendQuick('质量有问题')">投诉反馈</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <div class="status" id="status">已连接</div>
    </div>
</div>
<script>
let sessionId = 'demo_' + Date.now();
let turnCount = 0;
let isTyping = false;

function addMessage(text, role, intent, confidence) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + role;
    let meta = '';
    if (intent) {
        meta = `<div class="meta">意图: ${intent} | 置信度: ${(confidence*100).toFixed(0)}%</div>`;
    }
    div.innerHTML = `<div class="bubble">${text}${meta}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

// P2: 打字机效果
function addTypingMessage() {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'typing-msg';
    div.innerHTML = `<div class="bubble typing"><span class="typing-indicator"><span>.</span><span>.</span><span>.</span></span></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function removeTypingMessage() {
    const el = document.getElementById('typing-msg');
    if (el) el.remove();
}

// P2: 打字机效果显示文本
function typeWriter(element, text, index, callback) {
    if (index < text.length) {
        element.textContent = text.substring(0, index + 1);
        setTimeout(() => typeWriter(element, text, index + 1, callback), 30);
    } else {
        if (callback) callback();
    }
}

async function sendMessage() {
    const input = document.getElementById('input');
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;
    btn.textContent = '发送中...';
    status.textContent = '思考中...';
    status.className = 'status loading';
    addMessage(text, 'user');
    addTypingMessage();  // P3: 显示打字机指示器

    try {
        const resp = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text, session_id: sessionId})
        });
        const data = await resp.json();

        // P2: 打字机效果
        removeTypingMessage();
        const messages = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        let meta = '';
        if (data.intent) {
            meta = `<div class="meta">意图: ${data.intent} | 置信度: ${(data.confidence*100).toFixed(0)}%</div>`;
        }
        msgDiv.appendChild(bubble);
        msgDiv.insertAdjacentHTML('beforeend', meta);
        messages.appendChild(msgDiv);

        // P2: 流式打字机效果
        isTyping = true;
        typeWriter(bubble, data.reply, 0, () => {
            isTyping = false;
            turnCount = data.turn_count;
            status.textContent = `第 ${data.turn_count} 轮对话`;
            status.className = 'status';
            messages.scrollTop = messages.scrollHeight;
        });
    } catch(e) {
        removeTypingMessage();
        let errorMsg = '网络错误，请重试';
        if (e.name === 'AbortError') errorMsg = '请求超时，请稍后再试';
        addMessage(errorMsg, 'assistant');
        status.textContent = '连接失败';
        status.className = 'status error';
    }
    btn.disabled = false;
    btn.textContent = '发送';
    input.focus();
}

function sendQuick(text) {
    document.getElementById('input').value = text;
    sendMessage();
}

// 欢迎消息
addMessage('你好！我是智能客服助手，有什么可以帮您的？', 'assistant');
</script>
</body>
</html>
"""
